apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Preproduction architecture scaffold. It is not wired to CRC and does not
# imply that a multi-node / multi-zone preproduction cluster currently exists.
namespace: wero-poc-preprod

resources:
  - ../../base

commonAnnotations:
  gitops.mayabanque.io/managed-by: argocd
  gitops.mayabanque.io/environment: preprod
  gitops.mayabanque.io/version: v7-c1
  architecture.mayabanque.io/status: target-not-crc-validated

patches:
  # Preproduction target: two replicas separated by worker and balanced across
  # at least two zone values. Production remains stricter at 3 replicas / 3 zones.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api-gateway
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-gateway
      spec:
        replicas: 2
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: api-gateway
                    topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 2
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app: api-gateway

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: payment-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: payment-service
      spec:
        replicas: 2
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: payment-service
                    topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 2
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app: payment-service

  - target:
