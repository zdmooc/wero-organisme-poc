apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Preproduction architecture scaffold. It is not wired to CRC and does not
# imply that a multi-node / multi-zone preproduction cluster currently exists.
# CloudNativePG CRDs/operator and runtime Secrets are environment prerequisites.
namespace: wero-poc-preprod

resources:
  - ../../base
  - ../../components/postgresql-ha

commonAnnotations:
  gitops.mayabanque.io/managed-by: argocd
  gitops.mayabanque.io/environment: preprod
  gitops.mayabanque.io/version: v7-c2
  architecture.mayabanque.io/status: target-not-crc-validated

patches:
  # C2 removes the V6 single-instance PostgreSQL lab resources from preprod.
  # CNPG owns independent PVCs and the role-aware RW Service instead.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: postgresql
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postgresql
      $patch: delete

  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: postgresql-data
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgresql-data
      $patch: delete

  - target:
      version: v1
      kind: Service
      name: postgresql
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: postgresql
      $patch: delete

  # CNPG uses three database instances even in preprod so failover exercises can
  # model one primary plus two standby candidates. Worker separation is required
  # in the component; preprod adds a two-zone spread target.
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: mayabank-postgresql
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: mayabank-postgresql
      spec:
        topologySpreadConstraints:
          - maxSkew: 1
            minDomains: 2
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                cnpg.io/cluster: mayabank-postgresql

  # Preproduction target: two application replicas separated by worker and
  # balanced across at least two zone values.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api-gateway
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-gateway
      spec:
        replicas: 2
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: api-gateway
                    topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 2
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app: api-gateway

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: payment-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: payment-service
      spec:
        replicas: 2
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: payment-service
                    topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 2
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app: payment-service
            containers:
              - name: payment-service
                env:
                  - name: DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: postgresql-app
                        key: username
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: postgresql-app
                        key: password
                  - name: DB_NAME
                    value: wero
                  - name: QUARKUS_DATASOURCE_JDBC_URL
                    value: jdbc:postgresql://mayabank-postgresql-rw:5432/wero
                  - name: QUARKUS_DATASOURCE__OUTBOX__JDBC_URL
                    value: jdbc:postgresql://mayabank-postgresql-rw:5432/wero

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: consumer-psp
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: consumer-psp
      spec:
        replicas: 2
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: consumer-psp
                    topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 2
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app: consumer-psp

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: event-audit-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: event-audit-service
      spec:
        replicas: 2
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: event-audit-service
                    topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 2
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app: event-audit-service
            containers:
              - name: event-audit-service
                env:
                  - name: DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: postgresql-app
                        key: username
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: postgresql-app
                        key: password
                  - name: DB_NAME
                    value: wero
                  - name: QUARKUS_DATASOURCE_JDBC_URL
                    value: jdbc:postgresql://mayabank-postgresql-rw:5432/wero

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: mock-wero
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mock-wero
      spec:
        replicas: 2
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: mock-wero
                    topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 2
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app: mock-wero

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: mock-sct-inst
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mock-sct-inst
      spec:
        replicas: 2
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: mock-sct-inst
                    topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 2
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app: mock-sct-inst
            containers:
              - name: mock-sct-inst
                env:
                  - name: DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: postgresql-app
                        key: username
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: postgresql-app
                        key: password
                  - name: DB_NAME
                    value: wero
                  - name: QUARKUS_DATASOURCE_JDBC_URL
                    value: jdbc:postgresql://mayabank-postgresql-rw:5432/wero
