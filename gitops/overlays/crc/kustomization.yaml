apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wero-poc

resources:
  - ../../base

commonAnnotations:
  gitops.mayabanque.io/managed-by: argocd
  gitops.mayabanque.io/environment: crc
  gitops.mayabanque.io/version: v5

patches:
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: api-gateway
    patch: |-
      - op: add
        path: /spec/host
        value: api-gateway-wero-poc.apps-crc.testing
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: keycloak
    patch: |-
      - op: add
        path: /spec/host
        value: keycloak-wero-poc.apps-crc.testing
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: jaeger
    patch: |-
      - op: add
        path: /spec/host
        value: jaeger-wero-poc.apps-crc.testing
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: prometheus
    patch: |-
      - op: add
        path: /spec/host
        value: prometheus-wero-poc.apps-crc.testing
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: grafana
    patch: |-
      - op: add
        path: /spec/host
        value: grafana-wero-poc.apps-crc.testing
