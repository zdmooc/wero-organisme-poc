apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Architecture target only until C2-C7 complete the stateful, IAM, ingress,
# RTO/RPO and PRA design. This overlay is intentionally not wired to the CRC
# Argo CD Application. CloudNativePG/Redpanda Operator CRDs, cert-manager and
# runtime Secrets are environment prerequisites.
namespace: wero-poc-prod

resources:
  - ../../base
  - ../../components/postgresql-ha
  - ../../components/redpanda-ha

commonAnnotations:
  gitops.mayabanque.io/managed-by: argocd
  gitops.mayabanque.io/environment: prod
  gitops.mayabanque.io/version: v7-c3
  architecture.mayabanque.io/status: target-not-crc-validated

patches:
  # C2 removes the V6 single-instance PostgreSQL lab resources from production.
  # CNPG owns independent PVCs and the role-aware RW Service instead.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: postgresql
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postgresql
      $patch: delete

  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: postgresql-data
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgresql-data
      $patch: delete

  - target:
      version: v1
      kind: Service
      name: postgresql
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: postgresql
      $patch: delete

  # C3 removes the V6 single-broker dev-container from production. Redpanda
  # Operator owns the three-broker, TLS/SASL-enabled target.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kafka
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kafka
      $patch: delete

  - target:
      version: v1
      kind: Service
      name: kafka
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: kafka
      $patch: delete

  # Production CNPG target: one primary plus two standby candidates, with
  # required worker separation from the component and explicit 3-zone spread.
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: mayabank-postgresql
    patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: mayabank-postgresql
      spec:
        topologySpreadConstraints:
          - maxSkew: 1
            minDomains: 3
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                cnpg.io/cluster: mayabank-postgresql

  # C1 production scheduling target for application workloads:
  # - 3 replicas
  # - replicas must land on distinct workers
  # - replicas must be balanced across at least 3 zones
  # CRC cannot validate these multi-node / multi-zone constraints.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: api-gateway
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api-gateway
      spec:
        replicas: 3
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: api-gateway
                    topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 3
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app: api-gateway

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: payment-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: payment-service
      spec:
        replicas: 3
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: payment-service
                    topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 3
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app: payment-service
            containers:
              - name: payment-service
                env:
                  - name: DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: postgresql-app
                        key: username
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: postgresql-app
                        key: password
                  - name: DB_NAME
                    value: wero
                  - name: QUARKUS_DATASOURCE_JDBC_URL
                    value: jdbc:postgresql://mayabank-postgresql-rw:5432/wero
                  - name: QUARKUS_DATASOURCE__OUTBOX__JDBC_URL
                    value: jdbc:postgresql://mayabank-postgresql-rw:5432/wero
                  - name: KAFKA_BOOTSTRAP_SERVERS
                    value: redpanda-0.redpanda.wero-poc-prod.svc.cluster.local:9093,redpanda-1.redpanda.wero-poc-prod.svc.cluster.local:9093,redpanda-2.redpanda.wero-poc-prod.svc.cluster.local:9093
                  - name: KAFKA_SECURITY_PROTOCOL
                    value: SASL_SSL
                  - name: KAFKA_SASL_MECHANISM
                    value: SCRAM-SHA-512
                  - name: KAFKA_SASL_JAAS_CONFIG
                    valueFrom:
                      secretKeyRef:
                        name: redpanda-payment-producer
                        key: jaas-config
                  - name: KAFKA_SSL_TRUSTSTORE_TYPE
                    value: PEM
                  - name: KAFKA_SSL_TRUSTSTORE_LOCATION
                    value: /etc/redpanda-ca/ca.crt
                volumeMounts:
                  - name: redpanda-client-ca
                    mountPath: /etc/redpanda-ca
                    readOnly: true
            volumes:
              - name: redpanda-client-ca
                secret:
                  secretName: redpanda-client-ca
                  items:
                    - key: ca.crt
                      path: ca.crt

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: consumer-psp
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: consumer-psp
      spec:
        replicas: 3
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: consumer-psp
                    topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 3
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app: consumer-psp

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: event-audit-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: event-audit-service
      spec:
        replicas: 3
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: event-audit-service
                    topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 3
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app: event-audit-service
            containers:
              - name: event-audit-service
                env:
                  - name: DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: postgresql-app
                        key: username
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: postgresql-app
                        key: password
                  - name: DB_NAME
                    value: wero
                  - name: QUARKUS_DATASOURCE_JDBC_URL
                    value: jdbc:postgresql://mayabank-postgresql-rw:5432/wero
                  - name: KAFKA_BOOTSTRAP_SERVERS
                    value: redpanda-0.redpanda.wero-poc-prod.svc.cluster.local:9093,redpanda-1.redpanda.wero-poc-prod.svc.cluster.local:9093,redpanda-2.redpanda.wero-poc-prod.svc.cluster.local:9093
                  - name: KAFKA_SECURITY_PROTOCOL
                    value: SASL_SSL
                  - name: KAFKA_SASL_MECHANISM
                    value: SCRAM-SHA-512
                  - name: KAFKA_SASL_JAAS_CONFIG
                    valueFrom:
                      secretKeyRef:
                        name: redpanda-event-audit-consumer
                        key: jaas-config
                  - name: KAFKA_SSL_TRUSTSTORE_TYPE
                    value: PEM
                  - name: KAFKA_SSL_TRUSTSTORE_LOCATION
                    value: /etc/redpanda-ca/ca.crt
                volumeMounts:
                  - name: redpanda-client-ca
                    mountPath: /etc/redpanda-ca
                    readOnly: true
            volumes:
              - name: redpanda-client-ca
                secret:
                  secretName: redpanda-client-ca
                  items:
                    - key: ca.crt
                      path: ca.crt

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: mock-wero
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mock-wero
      spec:
        replicas: 3
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: mock-wero
                    topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 3
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app: mock-wero

  - target:
      group: apps
      version: v1
      kind: Deployment
      name: mock-sct-inst
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mock-sct-inst
      spec:
        replicas: 3
        template:
          spec:
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: mock-sct-inst
                    topologyKey: kubernetes.io/hostname
            topologySpreadConstraints:
              - maxSkew: 1
                minDomains: 3
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    app: mock-sct-inst
            containers:
              - name: mock-sct-inst
                env:
                  - name: DB_USER
                    valueFrom:
                      secretKeyRef:
                        name: postgresql-app
                        key: username
                  - name: DB_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: postgresql-app
                        key: password
                  - name: DB_NAME
                    value: wero
                  - name: QUARKUS_DATASOURCE_JDBC_URL
                    value: jdbc:postgresql://mayabank-postgresql-rw:5432/wero

  # With three application replicas, one voluntary disruption can be tolerated
  # while keeping two replicas available. This does not protect against a zone
  # failure by itself; the scheduler constraints above provide failure-domain
  # placement and the later C2-C7 phases cover the remaining dependencies.
  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: api-gateway
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: api-gateway
      spec:
        minAvailable: 2

  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: payment-service
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: payment-service
      spec:
        minAvailable: 2

  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: consumer-psp
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: consumer-psp
      spec:
        minAvailable: 2

  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: event-audit-service
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: event-audit-service
      spec:
        minAvailable: 2

  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: mock-wero
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: mock-wero
      spec:
        minAvailable: 2

  - target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: mock-sct-inst
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: mock-sct-inst
      spec:
        minAvailable: 2
