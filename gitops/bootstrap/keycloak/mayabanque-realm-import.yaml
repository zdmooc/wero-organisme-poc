apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: mayabanque-realm-bootstrap
  annotations:
    architecture.mayabanque.io/lifecycle: one-shot-delete-after-done
    architecture.mayabanque.io/status: target-not-runtime-validated
spec:
  keycloakCRName: mayabank-keycloak
  realm:
    realm: mayabanque
    enabled: true
    sslRequired: external
    registrationAllowed: false
    accessTokenLifespan: 300
    roles:
      realm:
        - name: payment-create
        - name: payment-read
        - name: payment-reconcile
        - name: consent-create
        - name: consent-sca
        - name: audit-read
    clients:
      - clientId: mayabanque-cli
        name: MayaBanque CLI POC
        enabled: true
        protocol: openid-connect
        publicClient: true
        directAccessGrantsEnabled: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        serviceAccountsEnabled: false
    users:
      - username: alice
        firstName: Alice
        lastName: MayaBanque
        email: alice@mayabanque.example
        emailVerified: true
        enabled: true
        requiredActions: []
        realmRoles:
          - payment-create
          - payment-read
          - payment-reconcile
          - consent-create
          - consent-sca
          - audit-read
      - username: auditor
        firstName: Audit
        lastName: MayaBanque
        email: auditor@mayabanque.example
        emailVerified: true
        enabled: true
        requiredActions: []
        realmRoles:
          - payment-read
          - audit-read

# Deliberately excluded from preprod/prod Kustomize resources:
# - KeycloakRealmImport is create-only and does not reconcile later realm edits.
# - no user credential is stored in Git; demo/target credentials are provisioned
#   through an external secret/admin procedure appropriate to the environment.
# - apply only after the Keycloak CR reports Ready, verify condition Done=true,
#   then delete this RealmImport CR to clean up its Job/Pod.
