apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api-gateway-public
  labels:
    ingress.mayabanque.io/shard: public
  annotations:
    architecture.mayabanque.io/status: target-not-runtime-validated
    architecture.mayabanque.io/requires-real-hostname: "true"
spec:
  to:
    kind: Service
    name: api-gateway
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak-public
  labels:
    ingress.mayabanque.io/shard: public
  annotations:
    architecture.mayabanque.io/status: target-not-runtime-validated
    architecture.mayabanque.io/requires-real-hostname: "true"
spec:
  to:
    kind: Service
    name: keycloak
    weight: 100
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
