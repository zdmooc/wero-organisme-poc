apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: wero-poc
  namespace: openshift-gitops
spec:
  description: MayaBanque Wero POC GitOps project
  sourceRepos:
    - https://github.com/zdmooc/wero-organisme-poc.git
  destinations:
    # CRC remains local to the management/CRC cluster.
    - namespace: wero-poc
      server: https://kubernetes.default.svc
    # V7 target namespaces are provider-neutral. Concrete remote cluster URLs are
    # stored only in Argo CD cluster registrations, never in Git.
    - namespace: wero-poc-preprod
      server: '*'
    - namespace: wero-poc-prod
      server: '*'
    - namespace: openshift-ingress-operator
      server: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    warn: true
    ignore:
      - group: ''
        kind: Secret
      - group: build.openshift.io
        kind: BuildConfig
      - group: build.openshift.io
        kind: Build
      - group: image.openshift.io
        kind: ImageStream
