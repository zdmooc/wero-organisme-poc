quarkus.application.name=api-gateway
quarkus.http.port=8080
quarkus.smallrye-health.root-path=/health
quarkus.http.limits.max-body-size=1M
quarkus.oidc.auth-server-url=http://keycloak:8080/realms/mayabanque
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.token.issuer=any
quarkus.rest-client.payment-backend.url=http://payment-service:8080
quarkus.rest-client.payment-backend.connect-timeout=1000
quarkus.rest-client.payment-backend.read-timeout=5000
quarkus.rest-client.audit-backend.url=http://event-audit-service:8080
quarkus.rest-client.audit-backend.connect-timeout=1000
quarkus.rest-client.audit-backend.read-timeout=5000
quarkus.otel.exporter.otlp.endpoint=http://jaeger:4317
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.simple=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.log.console.format=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5p service=api-gateway traceId=%X{traceId} spanId=%X{spanId} [%c{2.}] (%t) %s%e%n
