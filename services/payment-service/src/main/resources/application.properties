quarkus.application.name=payment-service
quarkus.http.port=8080
quarkus.rest-client.consumer-psp.url=http://consumer-psp:8080
quarkus.rest-client.consumer-psp.connect-timeout=1000
# V6 runs several N+1 workloads on a single-node CRC. The normal synchronous
# chain can exceed the V5 2s budget under local CPU contention. 4500ms keeps
# healthy traffic below the deliberate TIMEOUT_AFTER_SETTLEMENT failure path,
# whose rail mock sleeps for 5s after settlement.
quarkus.rest-client.consumer-psp.read-timeout=4500
quarkus.rest-client.sct-inst-status.url=http://mock-sct-inst:8080
quarkus.rest-client.sct-inst-status.connect-timeout=1000
quarkus.rest-client.sct-inst-status.read-timeout=2000
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:mayabanque}
quarkus.datasource.password=${DB_PASSWORD:mayabanque}
quarkus.datasource.jdbc.url=jdbc:postgresql://postgresql:5432/${DB_NAME:wero}
quarkus.datasource.jdbc.telemetry=true

# Dedicated outbox pool: same PostgreSQL database, but explicitly outside JTA.
# The scheduler/Kafka publisher must never share transaction enlistment state
# with Hibernate consent/payment transactions.
quarkus.datasource."outbox".db-kind=postgresql
quarkus.datasource."outbox".username=${DB_USER:mayabanque}
quarkus.datasource."outbox".password=${DB_PASSWORD:mayabanque}
quarkus.datasource."outbox".jdbc.url=jdbc:postgresql://postgresql:5432/${DB_NAME:wero}
quarkus.datasource."outbox".jdbc.transactions=disabled
quarkus.datasource."outbox".jdbc.min-size=1
quarkus.datasource."outbox".jdbc.max-size=3

# This service deliberately keeps JTA local to the synchronous database block.
# Do not propagate an active Narayana transaction to scheduler/reactive worker
# threads; remote HTTP and Kafka work already run outside JTA by design.
mp.context.ThreadContext.cleared=Transaction

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.smallrye-health.root-path=/health
kafka.bootstrap.servers=kafka:9092
wero.events.topic=payment-events
wero.outbox.batch-size=50
wero.sca.demo-code=${SCA_DEMO_CODE:123456}
quarkus.oidc.auth-server-url=http://keycloak:8080/realms/mayabanque
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.token.issuer=any
quarkus.otel.exporter.otlp.endpoint=http://jaeger:4317
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.simple=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.log.console.format=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5p service=payment-service traceId=%X{traceId} spanId=%X{spanId} [%c{2.}] (%t) %s%e%n
