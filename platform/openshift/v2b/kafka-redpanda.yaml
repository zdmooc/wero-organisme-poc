apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: wero-poc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp /etc/redpanda/redpanda.yaml /tmp/redpanda.yaml
              mkdir -p /tmp/redpanda-data
              rpk redpanda config set redpanda.data_directory /tmp/redpanda-data --config /tmp/redpanda.yaml
              exec rpk redpanda start \
                --config /tmp/redpanda.yaml \
                --kafka-addr=internal://0.0.0.0:9092 \
                --advertise-kafka-addr=internal://kafka:9092 \
                --rpc-addr=0.0.0.0:33145 \
                --advertise-rpc-addr=kafka:33145 \
                --mode=dev-container \
                --smp=1 \
                --default-log-level=info \
                --check=false
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp/.config
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: wero-poc
spec:
  selector:
    app: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: admin
      port: 9644
      targetPort: 9644
