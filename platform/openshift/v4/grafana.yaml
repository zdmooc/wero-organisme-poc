apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: wero-poc
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: wero-poc
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Wero POC
        orgId: 1
        folder: MayaBanque Wero
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-wero-dashboard
  namespace: wero-poc
data:
  wero-v4.json: |
    {
      "uid": "wero-v4",
      "title": "MayaBanque Wero — V4 Observability",
      "tags": ["wero", "poc", "v4"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "time": {"from": "now-30m", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Payments by final status",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (status) (wero_payments_total)", "legendFormat": "{{status}}", "refId": "A"}],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP request rate",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (job) (rate(http_server_requests_seconds_count[1m]))", "legendFormat": "{{job}}", "refId": "A"}],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Idempotent replays",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(wero_payments_idempotent_replays_total)", "refId": "A"}],
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 8}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Kafka audit events",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (event_type) (wero_audit_events_total)", "legendFormat": "{{event_type}}", "refId": "A"}],
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 8}
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Targets UP",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(up)", "refId": "A"}],
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 8}
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: wero-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.2.1
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_PATHS_DATA
              value: /tmp/grafana
            - name: GF_PATHS_LOGS
              value: /tmp/grafana-logs
            - name: GF_PATHS_PLUGINS
              value: /tmp/grafana-plugins
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: providers
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: providers
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-wero-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: wero-poc
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
