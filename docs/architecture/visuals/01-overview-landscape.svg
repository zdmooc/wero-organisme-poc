<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><style>.t{font-family:Arial,sans-serif;fill:#09235b}.h{font-size:43px;font-weight:700}.s{font-size:24px;fill:#496a9c}.ch{font-size:26px;font-weight:700}.b{font-size:20px}.sm{font-size:17px;fill:#53729d}.card{fill:#fff;stroke:#b8d7f2;stroke-width:2}.soft{fill:#f5faff}.green{fill:#eaf8ef;stroke:#b7e4c5}.blue{fill:#edf6ff}.pill{fill:#e8f6ee}.line{stroke:#0c84c6;stroke-width:4;fill:none}.muted{fill:#7186a6}.ok{fill:#1ba75a}</style></defs><rect width="1600" height="900" fill="#fff"/><text x="36" y="62" class="t h">01 — MayaBanque Wero/EPI POC — Vue d’ensemble</text><text x="38" y="101" class="t s">POC pédagogique de paiement instantané, résilience V6 validée sur CRC, cible V7 HA production préparée</text><text x="1295" y="58" class="t b">● ○ ○ ○ ○ ○ ○ ○ ○ ○</text><text x="1305" y="88" class="t sm">1 / 10</text><line x1="1472" y1="28" x2="1472" y2="93" stroke="#8fc9eb" stroke-width="2"/><text x="1490" y="58" class="t sm">De la preuve</text><text x="1490" y="82" class="t sm">à la production</text><rect x="30" y="136" width="330" height="610" rx="18" class="card soft"/><text x="60" y="184" class="t ch">Contexte</text><text x="60" y="238" class="t b">Banque fictive : MayaBanque</text><text x="60" y="284" class="t b">Inspiration : Wero / EPI</text><text x="60" y="330" class="t b">Objectif : paiement + observabilité</text><text x="60" y="361" class="t b">+ GitOps + résilience</text><text x="60" y="420" class="t b">Lab : OpenShift Local / CRC</text><text x="60" y="451" class="t b">namespace : wero-poc</text><rect x="50" y="560" width="290" height="118" rx="14" class="blue"/><text x="72" y="603" class="t sm">« Un terrain d’expérimentation</text><text x="72" y="632" class="t sm">tourné vers la production »</text><rect x="385" y="136" width="1185" height="402" rx="18" class="card"/><text x="420" y="183" class="t ch">Chaîne de paiement</text><g class="t b" text-anchor="middle"><rect x="410" y="222" width="135" height="92" rx="12" class="blue"/><text x="478" y="276">Client</text><rect x="575" y="222" width="155" height="92" rx="12" class="blue"/><text x="652" y="264">OpenShift</text><text x="652" y="290">Route</text><rect x="760" y="222" width="150" height="92" rx="12" class="blue"/><text x="835" y="264">API</text><text x="835" y="290">Gateway</text><rect x="940" y="222" width="155" height="92" rx="12" fill="#dff1ff" stroke="#0c84c6" stroke-width="3"/><text x="1017" y="264">Payment</text><text x="1017" y="290">Service</text><rect x="1125" y="222" width="145" height="92" rx="12" class="blue"/><text x="1198" y="264">Consumer</text><text x="1198" y="290">PSP</text><rect x="1300" y="222" width="125" height="92" rx="12" class="blue"/><text x="1363" y="264">Wero/EPI</text><text x="1363" y="290">Mock</text><rect x="1450" y="222" width="105" height="92" rx="12" class="blue"/><text x="1502" y="264">SCT Inst</text><text x="1502" y="290">Mock</text></g><g class="line"><path d="M545 268H575"/><path d="M730 268H760"/><path d="M910 268H940"/><path d="M1095 268H1125"/><path d="M1270 268H1300"/><path d="M1425 268H1450"/></g><text x="420" y="354" class="t ch">Dépendances &amp; services de plateforme</text><g class="t sm" text-anchor="middle"><rect x="520" y="386" width="155" height="95" rx="12" class="soft" stroke="#b8d7f2"/><text x="598" y="425">PostgreSQL</text><text x="598" y="451">Ledger / Outbox</text><rect x="695" y="386" width="155" height="95" rx="12" class="soft" stroke="#b8d7f2"/><text x="773" y="425">Kafka / Redpanda</text><text x="773" y="451">→ Event Audit</text><rect x="870" y="386" width="145" height="95" rx="12" class="soft" stroke="#b8d7f2"/><text x="942" y="425">OAuth2 / OIDC</text><text x="942" y="451">→ Keycloak</text><rect x="1035" y="386" width="150" height="95" rx="12" class="soft" stroke="#b8d7f2"/><text x="1110" y="425">OpenTelemetry</text><text x="1110" y="451">→ Jaeger</text><rect x="1205" y="386" width="145" height="95" rx="12" class="soft" stroke="#b8d7f2"/><text x="1278" y="425">Prometheus</text><text x="1278" y="451">→ Grafana</text><rect x="1370" y="386" width="175" height="95" rx="12" class="soft" stroke="#b8d7f2"/><text x="1457" y="416">Git → Kustomize</text><text x="1457" y="442">→ Argo CD</text><text x="1457" y="468">→ OpenShift GitOps</text></g><rect x="385" y="560" width="575" height="186" rx="18" class="green"/><text x="420" y="606" class="t ch">Résultat V6 CRC</text><g class="t b"><text x="425" y="651">✓ V0 → V5 : terminés</text><text x="425" y="688">✓ V6 A + B1 → B8 : validés</text><text x="425" y="725">✓ V4 OK / V5 OK / Argo Synced-Healthy</text><text x="715" y="651" class="muted">PR #8 : non mergée</text></g><rect x="985" y="560" width="585" height="186" rx="18" class="card soft"/><text x="1020" y="606" class="t ch">Préparation V7</text><g class="t b"><text x="1025" y="650">C1  Topologie OpenShift HA</text><text x="1025" y="686">C2  PostgreSQL HA</text><text x="1025" y="722">C3  Redpanda HA sécurisé</text><text x="1290" y="650">C4  Keycloak HA</text><text x="1290" y="686">C5  Frontdoor HA</text><text x="1290" y="722">C6/C7  RTO/RPO + PRA</text></g><rect x="30" y="785" width="1540" height="74" rx="14" fill="#eef6fd"/><text x="58" y="830" class="t sm">CRC prouve la résilience applicative et des dépendances contrôlées ; il ne prouve pas la HA multi-nœud / multi-zone / multi-site.</text></svg>