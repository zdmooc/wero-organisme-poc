<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>.t{font-family:Arial,sans-serif;fill:#09235b}.h{font-size:43px;font-weight:700}.s{font-size:24px;fill:#496a9c}.ch{font-size:23px;font-weight:700}.b{font-size:17px}.sm{font-size:15px;fill:#53729d}.c{fill:#fff;stroke:#b8d7f2;stroke-width:2}.ok{fill:#eaf8ef;stroke:#b7e4c5}.bl{fill:#eef7ff}</style><rect width="1600" height="900" fill="#fff"/><text x="36" y="62" class="t h">05 — V6 : Phase A, B1, B2, B3</text><text x="38" y="101" class="t s">N+1 et premières preuves de résilience sur CRC</text><text x="1295" y="58" class="t b">● ● ● ● ● ○ ○ ○ ○ ○</text><text x="1305" y="88" class="t sm">5 / 10</text><line x1="1472" y1="28" x2="1472" y2="93" stroke="#8fc9eb"/><text x="1490" y="55" class="t sm">Résilience des</text><text x="1490" y="78" class="t sm">composants clés</text><g class="t"><rect x="30" y="140" width="355" height="650" rx="18" class="c"/><text x="55" y="182" class="ch">Phase A — N+1 + PDB + kill pod</text><text x="55" y="218" class="sm">Tolérance à la perte d’un pod applicatif</text><rect x="75" y="275" width="100" height="85" rx="12" class="bl"/><text x="125" y="325" class="b" text-anchor="middle">Pod 1</text><rect x="195" y="275" width="100" height="85" rx="12" class="bl"/><text x="245" y="325" class="b" text-anchor="middle">Pod 2</text><rect x="315" y="275" width="45" height="85" rx="12" fill="#fdecec" stroke="#ee9696"/><text x="337" y="325" class="b" text-anchor="middle">×</text><text x="55" y="418" class="ch">OK</text><rect x="55" y="438" width="300" height="50" rx="10" class="ok"/><text x="75" y="470" class="b">Service maintenu disponible</text><text x="55" y="535" class="ch">Éléments de preuve</text><text x="60" y="580" class="b">✓ Replicas applicatifs : 2</text><text x="60" y="620" class="b">✓ PodDisruptionBudget</text><text x="60" y="660" class="b">✓ Suppression d’un pod</text><text x="60" y="686" class="b">  sans interruption métier</text><rect x="400" y="140" width="355" height="650" rx="18" class="c"/><text x="425" y="182" class="ch">B1 — PostgreSQL recovery</text><text x="425" y="218" class="sm">Panne contrôlée et reprise du service</text><rect x="455" y="285" width="115" height="90" rx="12" class="bl"/><text x="512" y="330" class="b" text-anchor="middle">PostgreSQL</text><text x="512" y="355" class="sm" text-anchor="middle">primary</text><text x="590" y="338" class="ch">→</text><rect x="620" y="285" width="105" height="90" rx="12" class="bl"/><text x="672" y="330" class="b" text-anchor="middle">Reprise</text><text x="425" y="418" class="ch">OK</text><rect x="425" y="438" width="300" height="50" rx="10" class="ok"/><text x="445" y="470" class="b">Service rétabli</text><text x="425" y="535" class="ch">Éléments de preuve</text><text x="430" y="580" class="b">✓ Panne contrôlée puis reprise</text><text x="430" y="620" class="b">✓ Récupération : 36 s</text><text x="430" y="660" class="b">✓ Régression finale : 14 s</text><rect x="770" y="140" width="355" height="650" rx="18" class="c"/><text x="795" y="182" class="ch">B2 — Kafka / Outbox</text><text x="795" y="218" class="sm">Buffering + replay des événements</text><rect x="805" y="275" width="120" height="80" rx="12" class="bl"/><text x="865" y="323" class="b" text-anchor="middle">Outbox</text><text x="945" y="323" class="ch">→</text><rect x="980" y="275" width="115" height="80" rx="12" class="bl"/><text x="1038" y="311" class="b" text-anchor="middle">Kafka</text><text x="1038" y="336" class="sm" text-anchor="middle">rétabli</text><text x="795" y="418" class="ch">OK</text><rect x="795" y="438" width="300" height="50" rx="10" class="ok"/><text x="815" y="470" class="b">Événements rejoués sans perte</text><text x="795" y="535" class="ch">Éléments de preuve</text><text x="800" y="580" class="b">✓ Tampon Outbox</text><text x="800" y="620" class="b">✓ Drain : 3/3 en 7 s</text><text x="800" y="660" class="b">✓ Aucune perte métier</text><rect x="1140" y="140" width="355" height="650" rx="18" class="c"/><text x="1165" y="182" class="ch">B3 — Keycloak outage</text><text x="1165" y="212" class="ch">cached JWT / JWK recovery</text><text x="1165" y="248" class="sm">Continuité d’authentification</text><rect x="1175" y="285" width="120" height="80" rx="12" class="bl"/><text x="1235" y="323" class="b" text-anchor="middle">JWT cache</text><text x="1320" y="323" class="ch">→</text><rect x="1350" y="285" width="115" height="80" rx="12" class="bl"/><text x="1408" y="311" class="b" text-anchor="middle">Keycloak</text><text x="1408" y="336" class="sm" text-anchor="middle">rétabli</text><text x="1165" y="418" class="ch">OK</text><rect x="1165" y="438" width="300" height="50" rx="10" class="ok"/><text x="1185" y="470" class="b">Authentification maintenue</text><text x="1165" y="535" class="ch">Éléments de preuve</text><text x="1170" y="580" class="b">✓ JWT existant utilisable</text><text x="1170" y="620" class="b">✓ Token : 120–131 s</text><text x="1170" y="660" class="b">✓ Auth/JWK : 124–135 s</text></g><rect x="30" y="815" width="1540" height="50" rx="12" fill="#eef6fd"/><text x="50" y="847" class="t sm">Ces résultats valident une résilience applicative contrôlée et mesurée, pas une HA physique de production.</text></svg>