<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>.t{font-family:Arial,sans-serif;fill:#09235b}.h{font-size:43px;font-weight:700}.s{font-size:24px;fill:#496a9c}.ch{font-size:23px;font-weight:700}.b{font-size:17px}.sm{font-size:15px;fill:#53729d}.c{fill:#fff;stroke:#b8d7f2;stroke-width:2}.bl{fill:#eef7ff}.gr{fill:#edf9f3}.ok{fill:#eaf8ef;stroke:#b7e4c5}.ln{stroke:#0c84c6;stroke-width:4;fill:none}</style><rect width="1600" height="900" fill="#fff"/><text x="36" y="62" class="t h">09 — V7 : C1 à C5</text><text x="38" y="101" class="t s">Préparation de la cible HA production</text><text x="1295" y="58" class="t b">● ● ● ● ● ● ● ● ● ○</text><text x="1305" y="88" class="t sm">9 / 10</text><line x1="1472" y1="28" x2="1472" y2="93" stroke="#8fc9eb"/><text x="1490" y="55" class="t sm">Du design Git</text><text x="1490" y="78" class="t sm">à la production</text><rect x="30" y="135" width="485" height="250" rx="18" class="c"/><text x="55" y="178" class="t ch">C1 — Topologie OpenShift HA</text><text x="65" y="225" class="t b">• anti-affinity</text><text x="65" y="260" class="t b">• topology spread</text><text x="65" y="295" class="t b">• preprod 2 zones</text><text x="65" y="330" class="t b">• prod 3 zones</text><text x="300" y="225" class="t b">• PDB</text><text x="300" y="260" class="t b">• scheduling worker/zone</text><rect x="535" y="135" width="485" height="250" rx="18" class="c"/><text x="560" y="178" class="t ch">C2 — PostgreSQL HA</text><text x="570" y="225" class="t b">• CloudNativePG</text><text x="570" y="260" class="t b">• base paiement HA</text><text x="570" y="295" class="t b">• service RW</text><text x="570" y="330" class="t b">• backup / PITR</text><text x="810" y="225" class="t b">• sync standby cible</text><rect x="1040" y="135" width="530" height="250" rx="18" class="c"/><text x="1065" y="178" class="t ch">C3 — Redpanda HA sécurisé</text><text x="1075" y="225" class="t b">• 3 brokers</text><text x="1075" y="260" class="t b">• TLS + SASL/SCRAM</text><text x="1075" y="295" class="t b">• ACL least-privilege</text><text x="1075" y="330" class="t b">• payment-events RF=3</text><text x="1325" y="225" class="t b">• clients adaptés</text><rect x="30" y="410" width="1240" height="230" rx="18" fill="#f2fbf6" stroke="#b7e4c5"/><text x="450" y="452" class="t ch">Positionnement des environnements vers la production HA</text><g class="t" text-anchor="middle"><rect x="120" y="490" width="260" height="105" rx="14" class="bl"/><text x="250" y="530" class="ch">CRC</text><text x="250" y="565" class="sm">Mono-nœud (POC / Dev)</text><rect x="495" y="490" width="260" height="105" rx="14" class="bl"/><text x="625" y="530" class="ch">Preprod</text><text x="625" y="565" class="sm">HA — 2 zones</text><rect x="870" y="490" width="260" height="105" rx="14" class="gr"/><text x="1000" y="530" class="ch">Prod</text><text x="1000" y="565" class="sm">HA — 3 zones</text></g><g class="ln"><path d="M380 542H495"/><path d="M755 542H870"/></g><rect x="1290" y="410" width="280" height="230" rx="18" class="c"/><text x="1315" y="455" class="t ch">État actuel</text><text x="1320" y="510" class="t b">✓ Design et Git readiness</text><text x="1320" y="550" class="t b">✓ Rendus CI validés</text><text x="1320" y="590" class="t b">… Runtime en attente d’infra</text><rect x="30" y="665" width="745" height="125" rx="18" class="c"/><text x="55" y="708" class="t ch">C4 — Keycloak HA</text><text x="65" y="750" class="t b">• Keycloak Operator  • DB IAM dédiée  • PDB  • service interne keycloak:8080  • realm one-shot</text><rect x="795" y="665" width="775" height="125" rx="18" class="c"/><text x="820" y="708" class="t ch">C5 — Frontdoor HA</text><text x="830" y="750" class="t b">• IngressControllers dédiés  • API Gateway + Keycloak publics  • re-encrypt  • observabilité non publique</text><rect x="30" y="815" width="1540" height="50" rx="12" fill="#eef6fd"/><text x="50" y="847" class="t sm">C1 à C5 préparent la haute disponibilité de production sans prétendre l’avoir déjà prouvée en runtime.</text></svg>