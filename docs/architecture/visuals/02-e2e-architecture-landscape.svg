<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>.t{font-family:Arial,sans-serif;fill:#09235b}.h{font-size:43px;font-weight:700}.s{font-size:24px;fill:#496a9c}.ch{font-size:25px;font-weight:700}.b{font-size:19px}.sm{font-size:16px;fill:#53729d}.c{fill:#fff;stroke:#b8d7f2;stroke-width:2}.bl{fill:#eef7ff}.gr{fill:#edf9f3}.ln{stroke:#0c84c6;stroke-width:4;fill:none}</style><rect width="1600" height="900" fill="#fff"/><text x="36" y="62" class="t h">02 — Architecture end-to-end</text><text x="38" y="101" class="t s">Du client au règlement, avec sécurité, persistance, événements et observabilité</text><text x="1295" y="58" class="t b">○ ● ○ ○ ○ ○ ○ ○ ○ ○</text><text x="1305" y="88" class="t sm">2 / 10</text><line x1="1472" y1="28" x2="1472" y2="93" stroke="#8fc9eb"/><text x="1490" y="62" class="t sm">Le flux complet</text><rect x="30" y="135" width="1220" height="650" rx="18" class="c"/><text x="65" y="180" class="t ch">Architecture globale</text><g class="t b" text-anchor="middle"><rect x="170" y="220" width="130" height="78" rx="12" class="bl"/><text x="235" y="268">Client</text><rect x="330" y="220" width="145" height="78" rx="12" class="bl"/><text x="402" y="255">OpenShift</text><text x="402" y="280">Route</text><rect x="505" y="220" width="140" height="78" rx="12" class="bl"/><text x="575" y="255">API</text><text x="575" y="280">Gateway</text><rect x="675" y="220" width="155" height="78" rx="12" fill="#def1ff" stroke="#0c84c6" stroke-width="3"/><text x="752" y="255">Payment</text><text x="752" y="280">Service</text><rect x="860" y="220" width="140" height="78" rx="12" class="bl"/><text x="930" y="255">Consumer</text><text x="930" y="280">PSP</text><rect x="1030" y="220" width="135" height="78" rx="12" class="bl"/><text x="1097" y="255">Wero/EPI</text><text x="1097" y="280">Mock</text><rect x="1185" y="220" width="55" height="78" rx="12" class="bl"/><text x="1212" y="255">SCT</text><text x="1212" y="280">Inst</text></g><g class="ln"><path d="M300 259H330"/><path d="M475 259H505"/><path d="M645 259H675"/><path d="M830 259H860"/><path d="M1000 259H1030"/><path d="M1165 259H1185"/></g><rect x="70" y="335" width="1140" height="100" rx="14" class="gr"/><text x="90" y="370" class="t ch">Sécurité</text><text x="210" y="370" class="t b">OAuth2 / OIDC → Keycloak</text><text x="210" y="402" class="t sm">API Gateway, Payment Service et Event Audit protégés</text><rect x="70" y="455" width="1140" height="112" rx="14" class="bl"/><text x="90" y="490" class="t ch">Persistance &amp; événements</text><g class="t b" text-anchor="middle"><rect x="310" y="500" width="140" height="50" rx="10" class="c"/><text x="380" y="532">PostgreSQL</text><rect x="470" y="500" width="120" height="50" rx="10" class="c"/><text x="530" y="532">Ledger</text><rect x="610" y="500" width="120" height="50" rx="10" class="c"/><text x="670" y="532">Outbox</text><rect x="760" y="500" width="165" height="50" rx="10" class="c"/><text x="842" y="532">Kafka / Redpanda</text><rect x="955" y="500" width="150" height="50" rx="10" class="c"/><text x="1030" y="532">Event Audit</text></g><g class="ln"><path d="M730 525H760"/><path d="M925 525H955"/></g><rect x="70" y="587" width="1140" height="86" rx="14" fill="#f1fbfb"/><text x="90" y="622" class="t ch">Observabilité</text><text x="260" y="622" class="t b">OpenTelemetry → Jaeger</text><text x="590" y="622" class="t b">Metrics → Prometheus → Grafana</text><text x="90" y="655" class="t sm">Traces, métriques et logs corrélés sur le flux complet</text><rect x="70" y="692" width="1140" height="68" rx="14" fill="#f5f3ff"/><text x="90" y="735" class="t ch">GitOps</text><text x="230" y="735" class="t b">Git → Kustomize → Argo CD / OpenShift GitOps → OpenShift</text><rect x="1275" y="135" width="295" height="650" rx="18" class="c"/><text x="1310" y="180" class="t ch">Principes clés</text><g class="t b"><text x="1310" y="235">1  Idempotence et clés de requête</text><text x="1310" y="290">2  Outbox pour la continuité</text><text x="1310" y="345">3  Réconciliation contrôlée</text><text x="1310" y="400">4  Observabilité bout-en-bout</text><text x="1310" y="455">5  Séparation CRC / production</text></g><rect x="30" y="810" width="1540" height="55" rx="12" fill="#eef6fd"/><text x="55" y="845" class="t sm">Le POC montre le comportement métier et technique de bout en bout ; la HA réelle dépend d’une infrastructure multi-nœud et multi-zone.</text></svg>