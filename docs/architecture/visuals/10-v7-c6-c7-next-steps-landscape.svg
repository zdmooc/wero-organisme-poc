<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>.t{font-family:Arial,sans-serif;fill:#09235b}.h{font-size:43px;font-weight:700}.s{font-size:24px;fill:#496a9c}.ch{font-size:23px;font-weight:700}.b{font-size:17px}.sm{font-size:15px;fill:#53729d}.c{fill:#fff;stroke:#b8d7f2;stroke-width:2}.bl{fill:#eef7ff}.gr{fill:#edf9f3}.ok{fill:#eaf8ef;stroke:#b7e4c5}.ln{stroke:#0c84c6;stroke-width:4;fill:none}</style><rect width="1600" height="900" fill="#fff"/><text x="36" y="62" class="t h">10 — V7 : C6, C7 et prochaines étapes</text><text x="38" y="101" class="t s">RTO/RPO, PRA multi-site et ce qu’il reste à valider sur une vraie infrastructure</text><text x="1295" y="58" class="t b">● ● ● ● ● ● ● ● ● ●</text><text x="1300" y="88" class="t sm">10 / 10</text><line x1="1472" y1="28" x2="1472" y2="93" stroke="#8fc9eb"/><text x="1490" y="62" class="t sm">La suite logique</text><rect x="30" y="140" width="545" height="620" rx="18" class="c"/><text x="60" y="185" class="t ch">C6 — Contrats de continuité</text><rect x="60" y="220" width="225" height="220" rx="14" class="bl"/><text x="85" y="260" class="t ch">RTO / RPO candidats</text><text x="85" y="305" class="t b">• RTO par capacité</text><text x="85" y="345" class="t b">• RPO par composant</text><text x="85" y="385" class="t b">• cibles par service</text><rect x="305" y="220" width="240" height="220" rx="14" class="bl"/><text x="330" y="260" class="t ch">SLI / SLO</text><text x="330" y="305" class="t b">• disponibilité / latence</text><text x="330" y="345" class="t b">• erreurs / succès</text><text x="330" y="385" class="t b">• synchro base paiement</text><rect x="60" y="465" width="225" height="220" rx="14" class="bl"/><text x="85" y="505" class="t ch">Critères d’acceptation</text><text x="85" y="550" class="t b">• services critiques couverts</text><text x="85" y="590" class="t b">• procédures testées</text><text x="85" y="630" class="t b">• Go / No-Go</text><rect x="305" y="465" width="240" height="220" rx="14" class="bl"/><text x="330" y="505" class="t ch">Priorités métier</text><text x="330" y="550" class="t b">• disponibilité paiements</text><text x="330" y="590" class="t b">• intégrité des données</text><text x="330" y="630" class="t b">• continuité parcours client</text><rect x="595" y="140" width="455" height="620" rx="18" class="c"/><text x="625" y="185" class="t ch">C7 — PRA multi-site</text><rect x="635" y="230" width="150" height="125" rx="14" class="bl"/><text x="710" y="275" class="t ch" text-anchor="middle">Site A</text><text x="710" y="308" class="t b" text-anchor="middle">actif</text><rect x="860" y="230" width="150" height="125" rx="14" class="bl"/><text x="935" y="275" class="t ch" text-anchor="middle">Site B</text><text x="935" y="308" class="t b" text-anchor="middle">secours chaud</text><path d="M785 292H860" class="ln"/><path d="M860 315H785" class="ln"/><text x="822" y="215" class="t sm" text-anchor="middle">Réplication et bascule</text><text x="630" y="420" class="t b">• fencing / anti split-brain</text><text x="630" y="470" class="t b">• failover / failback</text><text x="630" y="520" class="t b">• runbooks et readiness</text><text x="630" y="570" class="t b">• exercice PRA à planifier</text><rect x="1070" y="140" width="500" height="620" rx="18" class="c"/><text x="1100" y="185" class="t ch">Ce qu’il reste quand l’infra sera disponible</text><g class="t b"><text x="1110" y="240">○ Cluster OpenShift multi-worker / multi-zone</text><text x="1110" y="295">○ Secrets, certificats, DNS, LB</text><text x="1110" y="350">○ Backup object storage</text><text x="1110" y="405">○ Tests perte worker / zone / broker / DB / router</text><text x="1110" y="460">○ Mesures RTO/RPO réelles</text><text x="1110" y="515">○ Validation SRE / métier</text><text x="1110" y="570">○ Argo Rollouts réel</text><text x="1110" y="625">○ Option V8 : sandbox externe</text></g><rect x="30" y="785" width="1540" height="70" rx="14" class="ok"/><text x="60" y="828" class="t ch">Tout ce qui pouvait être terminé sans infrastructure réelle l’a été : architecture, GitOps, CI, documentation et runbooks.</text></svg>