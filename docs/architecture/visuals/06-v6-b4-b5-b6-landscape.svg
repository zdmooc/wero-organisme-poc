0" height="650" rx="18" class="c"/><text x="565" y="190" class="t ch">B5 — Wero/EPI outage</text><g class="t b" text-anchor="middle"><rect x="570" y="245" width="95" height="90" rx="11" fill="#fdecec" stroke="#ee9696"/><text x="617" y="280">Wero</text><text x="617" y="305">down</text><rect x="700" y="245" width="100" height="90" rx="11" class="bl"/><text x="750" y="280">payment</text><text x="750" y="305">UNKNOWN</text><rect x="835" y="245" width="75" height="90" rx="11" class="bl"/><text x="872" y="280">SCT</text><text x="872" y="305">0 row</text><rect x="945" y="245" width="60" height="90" rx="11" class="bl"/><text x="975" y="280">ledger</text><text x="975" y="305">0</text></g><g class="ln"><path d="M665 290H700"/><path d="M800 290H835"/><path d="M910 290H945"/></g><text x="565" y="420" class="t ch">Éléments de preuve</text><text x="570" y="465" class="t b">✓ même idempotency key</text><text x="570" y="505" class="t b">✓ aucun blind replay</text><text x="570" y="545" class="t b">✓ reconcile = NOT_FOUND</text><text x="570" y="585" class="t b">✓ UNKNOWN préservé</text><text x="570" y="625" class="t b">✓ reprise Wero : 11–12 s</text><rect x="1050" y="145" width="520" height="650" rx="18" class="c"/><text x="1075" y="190" class="t ch">B6 — Controlled recovery</text><g class="t b" text-anchor="middle"><rect x="1080" y="240" width="90" height="78" rx="10" class="bl"/><text x="1125" y="287">UNKNOWN</text><rect x="1190" y="240" width="110" height="78" rx="10" class="bl"/><text x="1245" y="276">confirmation</text><text x="1245" y="300">explicite</text><rect x="1320" y="240" width="100" height="78" rx="10" class="bl"/><text x="1370" y="276">rail</text><text x="1370" y="300">preflight</text><rect x="1440" y="240" width="100" height="78" rx="10" class="bl"/><text x="1490" y="287">NOT_FOUND</text><rect x="1080" y="360" width="100" height="78" rx="10" class="bl"/><text x="1130" y="396">claim</text><text x="1130" y="420">atomique</text><rect x="1200" y="360" width="110" height="78" rx="10" class="bl"/><text x="1255" y="396">RECOVERY_</text><text x="1255" y="420">PENDING</text><rect x="1330" y="360" width="100" height="78" rx="10" class="bl"/><text x="1380" y="396">1 seule</text><text x="1380" y="420">resoumission</text><rect x="1450" y="360" width="90" height="78" rx="10" class="ok"/><text x="1495" y="407">SETTLED</text></g><g class="ln"><path d="M1170 279H1190"/><path d="M1300 279H1320"/><path d="M1420 279H1440"/><path d="M1490 318V340H1130V360"/><path d="M1180 399H1200"/><path d="M1310 399H1330"/><path d="M1430 399H1450"/></g><text x="1075" y="510" class="t ch">Éléments de preuve</text><text x="1080" y="555" class="t b">✓ action RESUBMITTED</text><text x="1080" y="595" class="t b">✓ repeated recovery = ALREADY_FINAL</text><text x="1080" y="635" class="t b">✓ 1 rail row / 1 ledger</text><rect x="30" y="820" width="1540" height="48" rx="12" fill="#eef6fd"/><text x="50" y="850" class="t sm">Principe : ne jamais rejouer à l’aveugle un UNKNOWN ; décider explicitement, vérifier le rail, puis resoumettre une seule fois.</text></svg>