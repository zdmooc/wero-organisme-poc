<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>.t{font-family:Arial,sans-serif;fill:#09235b}.h{font-size:43px;font-weight:700}.s{font-size:24px;fill:#496a9c}.ch{font-size:24px;font-weight:700}.b{font-size:18px}.sm{font-size:15px;fill:#53729d}.c{fill:#fff;stroke:#b8d7f2;stroke-width:2}.ok{fill:#eaf8ef;stroke:#b7e4c5}.warn{fill:#fff7e6;stroke:#efd08a}.bl{fill:#eef7ff}</style><rect width="1600" height="900" fill="#fff"/><text x="36" y="62" class="t h">08 — Bilan V6 CRC</text><text x="38" y="101" class="t s">Ce qui est prouvé, ce qui ne l’est pas, et les métriques observées</text><text x="1295" y="58" class="t b">● ● ● ● ● ● ● ● ○ ○</text><text x="1305" y="88" class="t sm">8 / 10</text><line x1="1472" y1="28" x2="1472" y2="93" stroke="#8fc9eb"/><text x="1490" y="55" class="t sm">La preuve</text><text x="1490" y="78" class="t sm">sur CRC</text><rect x="30" y="140" width="755" height="445" rx="18" class="ok"/><text x="65" y="188" class="t ch">✓ Ce que CRC a prouvé</text><g class="t b"><text x="75" y="250">✓ V4 OK / V5 OK</text><text x="75" y="305">✓ Argo CD Synced / Healthy</text><text x="75" y="360">✓ Phase A + B1 → B8 validées</text><text x="75" y="415">✓ Observabilité bout-en-bout</text><text x="75" y="470">✓ Outbox / audit / idempotence</text><text x="75" y="525">✓ Recovery contrôlé des UNKNOWN</text></g><rect x="815" y="140" width="755" height="445" rx="18" class="warn"/><text x="850" y="188" class="t ch">⚠ Ce que CRC ne prouve pas</text><g class="t b"><text x="860" y="250">⚠ HA multi-nœud</text><text x="860" y="305">⚠ HA multi-zone</text><text x="860" y="360">⚠ HA multi-site</text><text x="860" y="415">⚠ PRA réel</text><text x="860" y="470">⚠ RPO=0 production garanti</text><text x="860" y="525">⚠ Load balancer / DNS réels</text></g><rect x="30" y="610" width="1540" height="160" rx="18" class="c"/><text x="65" y="655" class="t ch">Mesures observées</text><g class="t b" text-anchor="middle"><rect x="55" y="685" width="185" height="58" rx="10" class="bl"/><text x="147" y="720">PostgreSQL : 36 s → 14 s</text><rect x="255" y="685" width="180" height="58" rx="10" class="bl"/><text x="345" y="720">Outbox : 3/3 en 7 s</text><rect x="450" y="685" width="195" height="58" rx="10" class="bl"/><text x="547" y="720">Keycloak token : 120–131 s</text><rect x="660" y="685" width="205" height="58" rx="10" class="bl"/><text x="762" y="720">Auth/JWK : 124–135 s</text><rect x="880" y="685" width="180" height="58" rx="10" class="bl"/><text x="970" y="720">Wero : 11–12 s</text><rect x="1075" y="685" width="195" height="58" rx="10" class="bl"/><text x="1172" y="720">SCT Inst : 11–14 s</text><rect x="1285" y="685" width="255" height="58" rx="10" class="bl"/><text x="1412" y="720">API Gateway : 11–16 s</text></g><rect x="30" y="795" width="1540" height="62" rx="12" class="ok"/><text x="60" y="835" class="t ch">Conclusion : V6 CRC terminée, PR #8 mise à jour, non mergée.</text></svg>