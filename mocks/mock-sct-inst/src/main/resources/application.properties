quarkus.application.name=mock-sct-inst
quarkus.http.port=8080
quarkus.smallrye-health.root-path=/health

# V6 B4 externalizes the simulated SCT Inst settlement state so two replicas
# can answer POST and later status/reconciliation requests consistently.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:mayabanque}
quarkus.datasource.password=${DB_PASSWORD:mayabanque}
quarkus.datasource.jdbc.url=jdbc:postgresql://postgresql:5432/${DB_NAME:wero}
quarkus.datasource.jdbc.transactions=disabled
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=3

quarkus.otel.exporter.otlp.endpoint=http://jaeger:4317
quarkus.otel.exporter.otlp.protocol=grpc
quarkus.otel.simple=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.log.console.format=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5p service=mock-sct-inst traceId=%X{traceId} spanId=%X{spanId} [%c{2.}] (%t) %s%e%n
