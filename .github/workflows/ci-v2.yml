name: V2 compile checks

on:
  push:
    branches:
      - v2-state-ledger-reconciliation
  pull_request:
    branches:
      - v1-single-immediate

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/payment-service
          - services/consumer-psp
          - mocks/mock-wero
          - mocks/mock-sct-inst
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: mvn -B clean package -DskipTests
