name: V2/V2B/V3/V3B/V4/V5/V6 checks

on:
  push:
    branches:
      - v2-state-ledger-reconciliation
      - v2b-kafka-outbox-events
      - v3-security-consent-sca
      - v3b-api-gateway-zero-trust
      - v4-observability-e2e
      - v5-gitops-argocd
      - v6-spof-chaos-ha-resilience
  pull_request:
    branches:
      - v1-single-immediate
      - v2-state-ledger-reconciliation
      - v2b-kafka-outbox-events
      - v3-security-consent-sca
      - v3b-api-gateway-zero-trust
      - v4-observability-e2e
      - v5-gitops-argocd
      - v6-spof-chaos-ha-resilience

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/api-gateway
          - services/payment-service
          - services/consumer-psp
          - services/event-audit-service
          - mocks/mock-wero
          - mocks/mock-sct-inst
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: mvn -B clean package -DskipTests

  gitops-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Kustomize 5.8.1
        run: |
          curl -fsSL -o /tmp/kustomize.tgz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          echo "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d  /tmp/kustomize.tgz" | sha256sum -c -
          tar -xzf /tmp/kustomize.tgz -C /tmp
          /tmp/kustomize version

      - name: Render CRC desired state
        run: |
          /tmp/kustomize build gitops/overlays/crc > /tmp/wero-rendered.yaml
          grep -q 'name: api-gateway' /tmp/wero-rendered.yaml
          grep -q 'name: payment-service' /tmp/wero-rendered.yaml
          grep -q 'name: keycloak' /tmp/wero-rendered.yaml
          grep -q 'name: jaeger' /tmp/wero-rendered.yaml
          grep -q 'name: prometheus' /tmp/wero-rendered.yaml
          grep -q 'name: grafana' /tmp/wero-rendered.yaml

      - name: Verify V6 resilience resources when present
        run: |
          if [[ -f gitops/base/resilience.yaml ]]; then
            PDB_COUNT="$(grep -c '^kind: PodDisruptionBudget$' /tmp/wero-rendered.yaml)"
            [[ "$PDB_COUNT" -eq 5 ]] || { echo "Expected 5 PDBs for truly stateless workloads, got $PDB_COUNT"; exit 1; }
            grep -q 'minAvailable: 1' /tmp/wero-rendered.yaml
          fi

      - name: Verify runtime Secrets are not part of rendered desired state
        run: |
          if grep -E '^[[:space:]]*kind:[[:space:]]*Secret[[:space:]]*$' /tmp/wero-rendered.yaml; then
            echo 'ERROR: Secret manifest found in rendered runtime desired state'
            exit 1
          fi
